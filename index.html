<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4ki | 커미션 안내</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
  <!-- 아트머그 iframe 안에서 열리면 안쪽 스크롤바를 숨겨 '창 안의 창' 느낌을 없앱니다 -->
  <script>if (window.self !== window.top) document.documentElement.classList.add('in-frame');</script>
</head>
<body>
  <!-- 내용은 관리자 페이지(admin.html)에서 고칩니다. 이 파일은 고치지 않아도 됩니다. -->
  <div class="wrap">
    <nav class="nav">
      <a href="#about">About</a>
      <a href="#portfolio">Portfolio</a>
      <a href="#notice">Notice</a>
      <a href="#collab">Collab</a>
      <a href="#price">Price</a>
      <a href="#apply">Apply</a>
    </nav>
    <main id="app"></main>
  </div>

  <!-- 작업물 상세 창 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-bg" data-close></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal-close" data-close aria-label="닫기">×</button>
      <div class="video"><iframe id="modal-video" title="작업물 영상" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
      <div class="detail">
        <span class="badge" id="modal-cat"></span>
        <h3 class="serif" id="modal-title"></h3>
        <span class="detail-label">CREDIT</span>
        <p class="credit" id="modal-credit"></p>
      </div>
    </div>
  </div>

  <!-- 가격 옵션 팝업 -->
  <div class="pop" id="pop" hidden>
    <div class="pop-bg" data-close></div>
    <div class="pop-box" role="dialog" aria-modal="true" aria-labelledby="pop-name">
      <button type="button" class="pop-close" data-close aria-label="닫기">×</button>
      <h3 class="pop-name serif" id="pop-name"></h3>
      <p class="pop-price" id="pop-price"></p>
      <p class="pop-desc" id="pop-desc"></p>
      <button type="button" class="pop-apply" id="pop-apply">이 옵션으로 신청하기</button>
    </div>
  </div>

  <!-- 공용 모델 상세 창 -->
  <div class="modal shop" id="shop" hidden>
    <div class="modal-bg" data-close></div>
    <div class="modal-box shop-box" role="dialog" aria-modal="true" aria-labelledby="shop-name">
      <button type="button" class="modal-close" data-close aria-label="닫기">×</button>
      <div class="shop-media">
        <div class="shop-col" id="shop-photo-col">
          <div class="shop-stage photo"><img id="shop-photo" alt=""></div>
          <div class="shop-thumbs" id="shop-thumbs"></div>
        </div>
        <div class="shop-col" id="shop-video-col">
          <div class="shop-stage wide">
            <video id="shop-file" controls playsinline loop muted preload="metadata" hidden></video>
            <div class="video" id="shop-video-wrap" hidden><iframe id="shop-video" title="모델 영상" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
          </div>
        </div>
      </div>
      <div class="shop-info">
        <div class="shop-info-main">
          <span class="shop-status" id="shop-st"></span>
          <h3 class="serif" id="shop-name"></h3>
          <p class="shop-detail-price" id="shop-price"></p>
        </div>
        <div id="shop-opt-wrap">
          <span class="detail-label">TYPE <small>· 하나 선택</small></span>
          <div class="shop-opts" id="shop-opts"></div>
        </div>
        <div>
          <span class="detail-label">CREDIT</span>
          <p class="credit" id="shop-credit"></p>
        </div>
        <button type="button" class="shop-apply" id="shop-apply">이 모델로 신청하기</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
