<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아트머그 미리보기</title>
  <style>
    body { margin: 0; background: #eee; font-family: sans-serif; }
    .host { max-width: 960px; margin: 24px auto; padding: 16px; background: #fff; }
    .host p { color: #999; font-size: 13px; margin: 0 0 12px; }
  </style>
</head>
<body>
  <!-- 로컬 확인용: 아트머그 안에 iframe으로 들어간 모습을 흉내 냅니다. 업로드하지 않아도 됩니다. -->
  <div class="host">
    <p>(아트머그 프로필 영역이라고 가정)</p>
    <iframe src="index.html" style="width:100%; height:900px; border:0;" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
  </div>
</body>
</html>
